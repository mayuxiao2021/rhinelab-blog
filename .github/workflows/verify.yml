name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 18-step verify + build + release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install CJK fonts (OG images)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Verify (18 gates)
        run: pnpm verify

      - name: Subpath deployment regression
        run: pnpm test:subpath

      - name: Package release
        run: node scripts/package.mjs

      - name: Verify release zip
        run: node scripts/verify-release.mjs --full --build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhinelab-blog-dist
          path: |
            dist
            release/*.zip
            release/*-MANIFEST.txt
          retention-days: 7
